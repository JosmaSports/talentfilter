name: Enviar al servidor
on:
  push:
    branches:
      - main  # Se ejecuta cuando se sube algo a la rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
      REMOTE_USER: ${{ secrets.REMOTE_USER }}
      DEPLOY_ROOT: /var/www/talent-filter
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP + Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Composer install (en runner)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$REMOTE_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Crear tarball (incluye vendor/)
        run: |
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./uploads' \
            --exclude='./composer.phar' \
            --exclude='./node_modules' \
            -czf /tmp/talentfilter-deploy.tar.gz .
          ls -lh /tmp/talentfilter-deploy.tar.gz

      - name: Enviar y desplegar en servidor
        run: |
          set -euo pipefail

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              /tmp/talentfilter-deploy.tar.gz \
              "$REMOTE_USER@$REMOTE_HOST:/tmp/talentfilter-deploy.tar.gz"

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "$REMOTE_USER@$REMOTE_HOST" \
              "DEPLOY_ROOT='$DEPLOY_ROOT' bash -s" << 'ENDSSH'
          set -euo pipefail

          echo "=== Desplegando en $DEPLOY_ROOT ==="
          mkdir -p "$DEPLOY_ROOT"

          # Extrae el tarball (incluye vendor/ ya construido en el runner)
          tar xzf /tmp/talentfilter-deploy.tar.gz -C "$DEPLOY_ROOT"
          rm -f /tmp/talentfilter-deploy.tar.gz

          # Asegura subcarpetas de uploads
          mkdir -p "$DEPLOY_ROOT/uploads/originals" \
                   "$DEPLOY_ROOT/uploads/pages" \
                   "$DEPLOY_ROOT/uploads/unified"
          # 777 para que PHP-FPM (corra como el usuario que sea, en host o
          # dentro de un contenedor Docker) pueda escribir. El acceso publico
          # a estos directorios ya esta bloqueado en .htaccess.
          chmod -R 777 "$DEPLOY_ROOT/uploads" 2>/dev/null || true

          # Eliminar ficheros obsoletos que ya no estan en el repo
          # (tar extract no borra ficheros, solo los sobreescribe)
          rm -f "$DEPLOY_ROOT/register.php"
          rm -f "$DEPLOY_ROOT/api/webhook-deploy.php"
          rm -f "$DEPLOY_ROOT/deploy.sh"

          echo "=== Deploy OK ==="
          ENDSSH

      - name: Limpieza
        if: always()
        run: rm -f ~/.ssh/deploy_key /tmp/talentfilter-deploy.tar.gz
