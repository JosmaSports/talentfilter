; Configuracion PHP a nivel de directorio (compatible con PHP-FPM y mod_php).
; Se aplica recursivamente desde la raiz del proyecto. PHP-FPM cachea este
; archivo durante user_ini.cache_ttl segundos (default 300s = 5 min).

upload_max_filesize = 512M
post_max_size       = 512M
memory_limit        = 512M
max_execution_time  = 300
max_input_time      = 300
max_file_uploads    = 50
